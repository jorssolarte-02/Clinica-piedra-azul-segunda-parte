<section id="promociones" class="carousel-contenedor">
  <div class="carousel slide">
    <div class="carousel-indicators">
      @for (slide of slides; track slide.titulo; let i = $index) {
        <button type="button" [class.active]="i === indice" [attr.aria-current]="i === indice ? true : null" (click)="irA(i)" [attr.aria-label]="'Promoción ' + (i + 1)"></button>
      }
    </div>

    <div class="carousel-inner">
      @for (slide of slides; track slide.titulo; let i = $index) {
        <div class="carousel-item" [class.active]="i === indice">
          <div class="carousel-img-wrap">
            <img [src]="slide.imagen" class="d-block w-100" [alt]="slide.alt" />
          </div>
          <div class="carousel-caption">
            <span class="badge-promo"><i class="bi bi-stars me-1"></i>{{ slide.etiqueta }}</span>
            <h2>{{ slide.titulo }}</h2>
            <p class="mb-2">{{ slide.texto }}</p>
            <small><i class="bi bi-check2-circle me-1"></i>{{ slide.detalle }}</small>
          </div>
        </div>
      }
    </div>

    <button class="carousel-control-prev" type="button" (click)="anterior()" aria-label="Promoción anterior">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    </button>
    <button class="carousel-control-next" type="button" (click)="siguiente()" aria-label="Promoción siguiente">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
    </button>
  </div>
</section>
